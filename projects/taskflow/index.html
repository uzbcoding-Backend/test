<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1020"><title>Taskflow | CodeForge</title><link rel="stylesheet" href="../../assets/common.css"></head><body><div class="wrap"><header class="top"><a class="brand" href="../../index.html">⚡ CODE<span>FORGE</span></a><a class="link" href="../../index.html">← All projects</a></header><section class="hero"><div class="eyebrow">Interactive web app · HTML / CSS / JavaScript</div><h1>Taskflow</h1><p class="sub">Create, prioritize, complete, filter and delete tasks. Your to-do list is saved locally.</p></section>
<div class="panel"><h2>Create task</h2><form id="form" class="grid3"><div><label class="label">Task</label><input required maxlength="120" class="input" id="title" placeholder="Build my next website"></div><div><label class="label">Priority</label><select class="input" id="priority"><option>Medium</option><option>High</option><option>Low</option></select></div><div style="align-self:end"><button class="btn" style="width:100%">+ Add task</button></div></form></div><div class="panel"><div class="between"><h2>My tasks</h2><span id="counter" class="pill"></span></div><div class="tabs" id="tabs"></div><div id="items"></div></div>
<footer>Made for learning · All app data stays in your browser unless stated otherwise.</footer></div><script>"use strict";const $=s=>document.querySelector(s);const $$=s=>Array.from(document.querySelectorAll(s));const key="codeforgeTasks";let tasks=[];try{tasks=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){};let filter="All";function save(){localStorage.setItem(key,JSON.stringify(tasks));render()}$("#form").onsubmit=e=>{e.preventDefault();let name=$("#title").value.trim();if(!name)return;tasks.unshift({id:crypto.randomUUID(),name,priority:$("#priority").value,done:false});$("#title").value="";save()};function render(){$("#tabs").replaceChildren();["All","Open","Done"].forEach(f=>{let b=document.createElement("button");b.className=f===filter?"active":"";b.textContent=f;b.onclick=()=>{filter=f;render()};$("#tabs").append(b)});$("#counter").textContent=tasks.filter(x=>x.done).length+"/"+tasks.length+" completed";$("#items").replaceChildren();let shown=tasks.filter(t=>filter==="All"||(filter==="Open"?!t.done:t.done));if(!shown.length)$("#items").textContent="No tasks in this view.";shown.forEach(task=>{let row=document.createElement("div");row.className="item between";let left=document.createElement("label");left.className="row";let check=document.createElement("input");check.type="checkbox";check.checked=task.done;check.onchange=()=>{task.done=check.checked;save()};let name=document.createElement("span");name.textContent=task.name+" · "+task.priority;name.style.textDecoration=task.done?"line-through":"none";left.append(check,name);let del=document.createElement("button");del.className="btn danger";del.textContent="Delete";del.onclick=()=>{tasks=tasks.filter(x=>x.id!==task.id);save()};row.append(left,del);$("#items").append(row)})}render();</script></body></html>
