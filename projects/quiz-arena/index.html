<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1020"><title>Quiz Arena | CodeForge</title><link rel="stylesheet" href="../../assets/common.css"></head><body><div class="wrap"><header class="top"><a class="brand" href="../../index.html">⚡ CODE<span>FORGE</span></a><a class="link" href="../../index.html">← All projects</a></header><section class="hero"><div class="eyebrow">Interactive web app · HTML / CSS / JavaScript</div><h1>Quiz Arena</h1><p class="sub">Ten original questions on programming, technology and logic with instant feedback.</p></section>
<div class="grid3"><div class="panel"><div class="statlabel">Question</div><div id="number" class="stat">1/10</div></div><div class="panel"><div class="statlabel">Score</div><div id="score" class="stat">0</div></div><div class="panel"><div class="statlabel">Category</div><div class="stat" style="font-size:22px">Code & Logic</div></div></div><div class="panel"><h2 id="question"></h2><div class="stack" id="choices"></div><p id="feedback" role="status"></p><button id="next" class="btn" disabled>Next question →</button></div>
<footer>Made for learning · All app data stays in your browser unless stated otherwise.</footer></div><script>"use strict";const $=s=>document.querySelector(s);const $$=s=>Array.from(document.querySelectorAll(s));const questions=[{q:"Which tag creates a link in HTML?",a:["<a>","<link>","<url>"],r:0},{q:"Which Python symbol starts a comment?",a:["//","#","<!--"],r:1},{q:"What is 7 × 8?",a:["54","56","64"],r:1},{q:"Which method adds an element to a JavaScript array?",a:["push()","join()","split()"],r:0},{q:"What does CSS control?",a:["Page appearance","Server memory","File compression"],r:0},{q:"Which value is Boolean?",a:["42","true","hello"],r:1},{q:"How many bits make a byte?",a:["4","8","16"],r:1},{q:"What does Git track?",a:["Code changes","Weather","RAM temperature"],r:0},{q:"Which HTTP method commonly reads data?",a:["POST","DELETE","GET"],r:2},{q:"What is 2 to the power of 5?",a:["10","25","32"],r:2}];let i=0,score=0,answered=false;function render(){answered=false;$("#next").disabled=true;$("#feedback").textContent="";$("#number").textContent=Math.min(i+1,questions.length)+"/"+questions.length;$("#score").textContent=score;$("#choices").replaceChildren();if(i>=questions.length){$("#question").textContent="Finished! You scored "+score+"/"+questions.length+".";$("#next").disabled=false;$("#next").textContent="Play again";return}let q=questions[i];$("#question").textContent=q.q;q.a.forEach((a,j)=>{let b=document.createElement("button");b.className="btn secondary";b.textContent=a;b.onclick=()=>{if(answered)return;answered=true;const ok=j===q.r;if(ok)score++;$("#feedback").textContent=ok?"Correct!":"Correct answer: "+q.a[q.r];$("#feedback").className=ok?"success":"error";$("#score").textContent=score;$("#next").disabled=false;$$('#choices button').forEach(x=>x.disabled=true)};$("#choices").append(b)})}$("#next").onclick=()=>{if(i>=questions.length){i=0;score=0;$("#next").textContent="Next question →"}else i++;render()};render();</script></body></html>
